{% extends 'base.html' %}
{% set active_page = 'home' %}



{% block content %}


<main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">

            <form id="joinForm" action="/join" method="post" style="color: white;" class="p-5 border rounded-3 bg-dark">
                <!-- 2 column grid layout with text inputs for the first and last names -->
                <div class="row mb-4">
                    <div class="col">
                        <div data-mdb-input-init class="form-outline">
                            <input type="text" id="form3Example1" class="form-control" name="firstname" placeholder="Jhon" required>
                            <label class="form-label" for="form3Example1">First name</label>
                        </div>
                    </div>
                    <div class="col">
                        <div data-mdb-input-init class="form-outline">
                            <input type="text" id="form3Example2" class="form-control" name="lastname" placeholder="Doe" required>
                            <label class="form-label" for="form3Example2">Last name</label>
                        </div>
                    </div>
                </div>

                <!-- Email input -->
                <div data-mdb-input-init class="form-outline mb-4">
                    <input type="email" id="form3Example3" class="form-control" name="email" placeholder="john.doe@example.com" required>
                    <label class="form-label" for="form3Example3">Email address</label>
                </div>

                <!-- Password input -->
                <div class="mb-4">
                    <div class="input-group">
                        <input type="password" id="passwordField" class="form-control" name="password" placeholder="Password" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="passwordField">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <label class="form-label" for="passwordField">Password</label>
                </div>

                <div class="mb-4">
                    <div class="input-group">
                        <input type="password" id="confirmPasswordField" class="form-control" name="password2" placeholder="Confirm Password" required>
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" data-target="confirmPasswordField">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <label class="form-label" for="confirmPasswordField">Confirm Password</label>
                </div>

                <!-- Submit button -->
                <button data-mdb-ripple-init type="submit" class="btn btn-primary join-form btn-block mb-4">Sign up</button>

                <!-- Register buttons -->
                <div class="text-center">
                    <p>Already have an account? <a href="/login">Login here</a></p>
                    <p>or sign up with:</p>
                    <button data-mdb-ripple-init type="button" class="btn btn-secondary btn-floating mx-1">
                        <i class="bi bi-facebook"></i>
                    </button>

                    <button data-mdb-ripple-init type="button" class="btn btn-secondary btn-floating mx-1">
                        <i class="bi bi-google"></i>
                    </button>

                    <button data-mdb-ripple-init type="button" class="btn btn-secondary btn-floating mx-1">
                        <i class="bi bi-twitter"></i>
                    </button>

                    <button data-mdb-ripple-init type="button" class="btn btn-secondary btn-floating mx-1">
                        <i class="bi bi-github"></i>
                    </button>
                </div>
            </form>

        </div>
    </div>
</main>

<script>
    document.querySelectorAll(".toggle-password-btn").forEach((button) => {
        button.addEventListener("click", () => {
            const targetId = button.getAttribute("data-target");
            const input = document.getElementById(targetId);
            const icon = button.querySelector("i");

            if (!input || !icon) {
                return;
            }

            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            icon.classList.toggle("bi-eye", !isPassword);
            icon.classList.toggle("bi-eye-slash", isPassword);
        });
    });
</script>

{% endblock %}
